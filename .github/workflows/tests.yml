name: "tests"

on:
  pull_request: ~
  push: ~

jobs:
  type-tests:
    name: "type tests (psalm ${{ matrix.psalm }})"
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        psalm: ["6.19.0", "^6.19", "^7"]
    steps:
      - name: "checkout"
        uses: "actions/checkout@v2"

      - name: "installing PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          php-version: "8.4"
          ini-values: memory_limit=-1
          tools: composer:v2
          extensions: bcmath, mbstring, intl, sodium, json

      - name: "installing dependencies"
        run: "composer update --no-interaction --no-progress --with \"vimeo/psalm:${{ matrix.psalm }}\""

      - name: "running type tests"
        run: "vendor/bin/psalm -c tests/psalm.xml --no-progress --no-cache"
